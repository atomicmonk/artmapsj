    #header {

    #search {
      flex: 1; max-width: 400px; padding: 0.5rem 0.75rem;
      border-radius: 6px; border: 1px solid #444; background: #1a1a1a;
      color: #eee; font-size: 0.9rem;
    }
    #search::placeholder { color: #666; }
    #locate-btn {
      padding: 0.5rem 0.75rem; background: #f97316; border: none;

    }
    #locate-btn:hover { background: #ea6c0a; }
    #map { position: fixed; top: 52px; left: 0; right: 0; bottom: 0; }
    #count {

      border-radius: 20px; font-size: 0.8rem; color: #aaa; border: 1px solid #333;

    .popup-title { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
    .popup-row { font-size: 0.82rem; color: #aaa; margin-bottom: 0.25rem; line-height: 1.4; }
    .popup-row strong { color: #ddd; }
    .popup-row a { color: #f97316; text-decoration: none; }
    .popup-row a:hover { text-decoration: underline; }
    .tag {

      letter-spacing: 0.04em; text-transform: uppercase;

    .tag-mural  { background: #7c3aed22; color: #a78bfa; border: 1px solid #7c3aed55; }
    .tag-street { background: #15803d22; color: #4ade80; border: 1px solid #15803d55; }
  </style>

function markerIcon(type) {

    className: '',
    html: '<div style="width:12px;height:12px;background:' + color + ';border:2px solid #fff;border-radius:50%;box-shadow:0 0 6px ' + color + '88;"></div>',
    iconSize: [12, 12], iconAnchor: [6, 6], popupAnchor: [0, -8]
  });
}

let allMarkers = [];

function buildPopup(d) {
  return '<div class="popup-title">' + d.t + '</div>' +
    '<span class="tag tag-artbox">Art Box</span>' +
    (d.a ? '<div class="popup-row"><strong>Artist:</strong> ' + d.a + '</div>' : '') +
    (d.s ? '<div class="popup-row"><strong>Sponsor:</strong> ' + d.s + '</div>' : '') +
    (d.n ? '<div class="popup-row">' + d.n + '</div>' : '') +
    '<div class="popup-row" style="margin-top:0.5rem"><a href="https://maps.google.com/?q=' + encodeURIComponent(d.t + ' San Jose CA') + '" target="_blank">View on Google Maps &#8599;</a></div>';
}

function loadMarkers(dataset) {
  allMarkers.forEach(function(m) { map.removeLayer(m.marker); });
  allMarkers = [];
  dataset.forEach(function(d) {
    var marker = L.marker([d.lat, d.lng], { icon: markerIcon('Art Box') })
      .addTo(map)
      .bindPopup(buildPopup(d), { maxWidth: 300 });
    allMarkers.push({ marker: marker, data: d });
  });
  document.getElementById('count').textContent = allMarkers.length + ' art boxes on map';
}

loadMarkers(data);

document.getElementById('search').addEventListener('input', function() {
  var q = this.value.toLowerCase().trim();
  var visible = 0;
  allMarkers.forEach(function(item) {
    var d = item.data;
    var match = !q
      || d.t.toLowerCase().includes(q)
      || d.a.toLowerCase().includes(q)
      || d.s.toLowerCase().includes(q)
      || d.n.toLowerCase().includes(q);
    if (match) { item.marker.addTo(map); visible++; }
    else { map.removeLayer(item.marker); }
  });
  document.getElementById('count').textContent = q
    ? visible + ' result' + (visible !== 1 ? 's' : '') + ' for "' + q + '"'
    : allMarkers.length + ' art boxes on map';
});

document.getElementById('locate-btn').addEventListener('click', function() {
  map.locate({ setView: true, maxZoom: 16 });
});

map.on('locationerror', function() {
  alert('Could not get your location. Please allow location access and try again.');
});

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtMapSJ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #111;
      color: #eee;
    }

    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(6px);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid #333;
    }

    #header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #fff;
      white-space: nowrap;
    }

    #header h1 span { color: #f97316; }

    #search {
      flex: 1;
      max-width: 400px;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      border: 1px solid #444;
      background: #1a1a1a;
      color: #eee;
      font-size: 0.9rem;
    }

    #search::placeholder { color: #666; }

    #locate-btn {
      padding: 0.5rem 0.75rem;
      background: #f97316;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    #locate-btn:hover { background: #ea6c0a; }

    #map {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
    }

    #count {
      position: fixed;
      bottom: 1rem;
      left: 1rem;
      z-index: 1000;
      background: rgba(10,10,10,0.85);
      padding: 0.4rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #aaa;
      border: 1px solid #333;
    }

    /* Popup styles */
    .leaflet-popup-content-wrapper {
      background: #1a1a1a;
      color: #eee;
      border: 1px solid #333;
      border-radius: 8px;
    }

    .leaflet-popup-tip { background: #1a1a1a; }

    .popup-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .popup-row {
      font-size: 0.82rem;
      color: #aaa;
      margin-bottom: 0.25rem;
      line-height: 1.4;
    }

    .popup-row strong { color: #ddd; }

    .popup-row a {
      color: #f97316;
      text-decoration: none;
    }

    .popup-row a:hover { text-decoration: underline; }

    .popup-img {
      width: 100%;
      max-height: 160px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }

    .tag {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      margin-bottom: 0.5rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .tag-mural     { background: #7c3aed22; color: #a78bfa; border: 1px solid #7c3aed55; }
    .tag-artbox    { background: #0369a122; color: #38bdf8; border: 1px solid #0369a155; }
    .tag-street    { background: #15803d22; color: #4ade80; border: 1px solid #15803d55; }
  </style>
</head>
<body>

<div id="header">
  <h1>Art<span>Map</span>SJ</h1>
  <input id="search" type="text" placeholder="Search by title, artist, or address…">
  <button id="locate-btn">📍 Near Me</button>
</div>

<div id="map"></div>
<div id="count">Loading…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

  // ─── MAP SETUP ────────────────────────────────────────────────────────────
  const map = L.map('map').setView([37.3382, -121.8863], 13);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
    maxZoom: 19
  }).addTo(map);

  // ─── MARKER COLORS BY TYPE ────────────────────────────────────────────────
  function markerIcon(type) {
    const colors = {
      'Mural':       '#a78bfa',
      'Art Box':     '#38bdf8',
      'Street Art':  '#4ade80'
    };
    const color = colors[type] || '#f97316';
    return L.divIcon({
      className: '',
      html: `<div style="
        width:14px;height:14px;
        background:${color};
        border:2px solid #fff;
        border-radius:50%;
        box-shadow:0 0 6px ${color}88;
      "></div>`,
      iconSize: [14, 14],
      iconAnchor: [7, 7],
      popupAnchor: [0, -10]
    });
  }

  // ─── SAMPLE DATA (replace with Google Sheets CSV fetch below) ────────────
  const sampleData = [
    {
      title: "The Garden of Cosmic Speculation",
      artist: "Various Artists",
      date: "2018",
      sponsor: "City of San Jose",
      address: "200 E Santa Clara St, San Jose, CA",
      lat: 37.3361,
      lng: -121.8864,
      type: "Mural",
      image: "",
      notes: "Sample entry — replace with real data"
    },
    {
      title: "Art Box #42",
      artist: "Maria Lopez",
      date: "2021",
      sponsor: "San Jose Arts Commission",
      address: "1st St & Santa Clara St, San Jose, CA",
      lat: 37.3388,
      lng: -121.8897,
      type: "Art Box",
      image: "",
      notes: ""
    },
    {
      title: "Roots & Wings",
      artist: "James Chen",
      date: "2020",
      sponsor: "MACLA",
      address: "510 S 1st St, San Jose, CA",
      lat: 37.3318,
      lng: -121.8851,
      type: "Street Art",
      image: "",
      notes: ""
    }
  ];

  // ─── GOOGLE SHEETS CSV FETCH ──────────────────────────────────────────────
  // When your sheet is ready:
  // 1. File → Share → Publish to web → CSV
  // 2. Replace SHEET_ID below and uncomment this block
  //
  // const SHEET_ID = 'YOUR_SHEET_ID_HERE';
  // const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/pub?output=csv`;
  //
  // fetch(CSV_URL)
  //   .then(r => r.text())
  //   .then(csv => {
  //     const rows = parseCSV(csv);
  //     loadMarkers(rows);
  //   });

  // ─── CSV PARSER ───────────────────────────────────────────────────────────
  function parseCSV(csv) {
    const [headerLine, ...lines] = csv.trim().split('\n');
    const headers = headerLine.split(',').map(h => h.trim().toLowerCase());
    return lines.map(line => {
      const vals = line.split(',');
      const obj = {};
      headers.forEach((h, i) => obj[h] = (vals[i] || '').trim().replace(/^"|"$/g, ''));
      return obj;
    });
  }

  // ─── LOAD MARKERS ─────────────────────────────────────────────────────────
  let allMarkers = [];

  function buildPopup(d) {
    const tagClass = { 'Mural': 'tag-mural', 'Art Box': 'tag-artbox', 'Street Art': 'tag-street' };
    return `
      ${d.image ? `<img class="popup-img" src="${d.image}" alt="${d.title}">` : ''}
      <div class="popup-title">${d.title || 'Untitled'}</div>
      <span class="tag ${tagClass[d.type] || ''}">${d.type || 'Art'}</span>
      ${d.artist   ? `<div class="popup-row"><strong>Artist:</strong> ${d.artist}</div>` : ''}
      ${d.date     ? `<div class="popup-row"><strong>Year:</strong> ${d.date}</div>` : ''}
      ${d.sponsor  ? `<div class="popup-row"><strong>Sponsor:</strong> ${d.sponsor}</div>` : ''}
      ${d.address  ? `<div class="popup-row"><strong>Address:</strong>
        <a href="https://maps.google.com/?q=${encodeURIComponent(d.address)}" target="_blank">${d.address}</a>
      </div>` : ''}
      ${d.notes    ? `<div class="popup-row">${d.notes}</div>` : ''}
    `;
  }

  function loadMarkers(data) {
    allMarkers.forEach(m => map.removeLayer(m.marker));
    allMarkers = [];

    data.forEach(d => {
      const lat = parseFloat(d.lat);
      const lng = parseFloat(d.lng);
      if (isNaN(lat) || isNaN(lng)) return;

      const marker = L.marker([lat, lng], { icon: markerIcon(d.type) })
        .addTo(map)
        .bindPopup(buildPopup(d), { maxWidth: 280 });

      allMarkers.push({ marker, data: d });
    });

    document.getElementById('count').textContent =
      `${allMarkers.length} artwork${allMarkers.length !== 1 ? 's' : ''} on map`;
  }

  // Load sample data on start
  loadMarkers(sampleData);

  // ─── SEARCH ───────────────────────────────────────────────────────────────
  document.getElementById('search').addEventListener('input', function () {
    const q = this.value.toLowerCase().trim();
    let visible = 0;

    allMarkers.forEach(({ marker, data: d }) => {
      const match = !q
        || (d.title   || '').toLowerCase().includes(q)
        || (d.artist  || '').toLowerCase().includes(q)
        || (d.address || '').toLowerCase().includes(q)
        || (d.type    || '').toLowerCase().includes(q);

      if (match) {
        marker.addTo(map);
        visible++;
      } else {
        map.removeLayer(marker);
      }
    });

    document.getElementById('count').textContent =
      q ? `${visible} result${visible !== 1 ? 's' : ''} for "${q}"` :
          `${allMarkers.length} artworks on map`;
  });

  // ─── LOCATE ME ────────────────────────────────────────────────────────────
  document.getElementById('locate-btn').addEventListener('click', function () {
    map.locate({ setView: true, maxZoom: 16 });
  });

  map.on('locationerror', function () {
    alert('Could not get your location. Please allow location access and try again.');
  });

</script>
</body>
</html>
